services:
  app:
    image: openspeedtest/latest:v2.0.6@sha256:a6a7e3b3e9e93cfe7b9b2eb49c60b2a93644149a0a600845d4df57148b193ff6
    restart: unless-stopped
    expose:
    - '3000'
    environment:
      ENABLE_LETSENCRYPT: 'false'
    healthcheck:
      test:
      - CMD-SHELL
      - wget -q -O /dev/null http://127.0.0.1:3000/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
    - backend
  gateway:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    entrypoint:
    - sh
    - /ops/gateway-start.sh
    environment:
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?Configurar usuario}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Configurar bcrypt}
    volumes:
    - ./ops:/ops:ro
    expose:
    - '8080'
    depends_on:
      app:
        condition: service_healthy
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    healthcheck:
      test:
      - CMD-SHELL
      - wget -S -q -O /dev/null http://127.0.0.1:8080/ 2>&1 | grep -q ' 401'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
    - default
    - backend
networks:
  backend:
    internal: true
